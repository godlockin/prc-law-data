name: Offline data regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/package_common.py --destination /tmp/law-common-wheel
      - run: python -m pip install /tmp/law-common-wheel/prc_law_common-1.0.0-py3-none-any.whl
      - run: python3 -B -m unittest discover -s tests -v
